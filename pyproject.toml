[project]
name = "pebble-shimmer"
version = "1.1.1"
description = "A drop-in replacement for ops.pebble.Client that uses the Pebble CLI"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Tony Meyer", email = "shimmer@aotearoa.dev"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "ops>=2.0.0,<4",
    "PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "ruff==0.16.4",
    "ty==0.0.73",
    "tox>=4.0.0",
    "pre-commit>=3.0.0",
    "zizmor>=1.28.0",
]

[project.urls]
Homepage = "https://github.com/tonyandrewmeyer/shimmer"
Repository = "https://github.com/tonyandrewmeyer/shimmer"
Documentation = "https://github.com/tonyandrewmeyer/shimmer#readme"
"Bug Tracker" = "https://github.com/tonyandrewmeyer/shimmer/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/shimmer"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/CHANGELOG.md",
    "/README.md",
    "/LICENSE",
]

# Ruff configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=shimmer",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "requires_pebble: marks tests that require a working Pebble installation",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if False:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
src = ["src", "tests"]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "N",
    "A",
    "UP",
    "YTT",
    "S",
    "B",
    "C4",
    "SIM",
    "RUF",
    "PERF",
    "D",
    "FA",
    "TC",
]
ignore = [
    "D105",
    "D107",
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
    "E501",
    "B008",
    # Method docstrings are not mandated; module/class/function docs are.
    "D102",
    # This tool deliberately shells out to juju/charmcraft/snap.
    "S603",
    "S607",
    # Mirrors the ops.pebble API surface (id/type/input, ConnectionError).
    "A002",
    "A004",
]

[tool.ruff.lint.per-file-ignores]
"demo.py" = ["S108", "S103", "D103"]  # A throwaway demo script, not shipped code.
"**/tests/**" = ["S101", "S105", "S106", "S108", "PLR2004", "ARG", "SLF001", "N802", "N803", "N806", "D"]

[tool.ruff.lint.isort]
known-first-party = ["shimmer"]

# Pytest configuration
