name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "**" ]
  # Allow other workflows (e.g. publish.yaml) to gate on these checks.
  workflow_call:

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

    - run: uv tool install tox

    - name: Lint
      run: uv run tox -e lint

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Pebble (for integration tests)
      run: |
        sudo snap install pebble --classic --channel=latest/stable
        pebble version --client

    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

    - run: uv tool install tox

    - name: Run unit tests
      run: |
        uv run tox -e unit

    - name: Run integration tests
      run: |
        export PEBBLE=/tmp/pebble-test
        mkdir -p $PEBBLE/layers
        uv run tox -e integration
